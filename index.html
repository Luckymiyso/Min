<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>碰碰星·静谧宇宙</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#020210;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
#canvas-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
#fireworkCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:50;pointer-events:none}
.top-bar{
  position:fixed;top:0;left:0;right:0;
  padding:max(env(safe-area-inset-top),16px) 16px 0 16px;
  z-index:20;display:flex;justify-content:space-between;align-items:center;
}
.top-left{display:flex;gap:8px;align-items:center}
.top-right{display:flex;gap:8px;align-items:center}
.icon-btn{
  width:42px;height:42px;border-radius:50%;
  background:rgba(8,12,28,0.75);backdrop-filter:blur(20px);
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,0.08);cursor:pointer;
  color:#8899cc;font-size:1.1rem;transition:all .2s;
}
.icon-btn:active{transform:scale(0.9)}
.star-badge{
  background:rgba(8,12,28,0.75);backdrop-filter:blur(20px);
  border-radius:30px;padding:8px 14px;display:flex;align-items:center;gap:6px;
  border:1px solid rgba(180,200,255,0.15);cursor:pointer;
}
.star-emoji{font-size:1.2rem}
.star-count{font-weight:600;color:#a0b0ff;font-size:.95rem}
.ui-layer{
  position:fixed;bottom:0;left:0;right:0;
  padding:0 16px calc(env(safe-area-inset-bottom,16px) + 12px) 16px;
  z-index:20;display:flex;flex-direction:column;gap:10px;
}
.input-card{
  background:rgba(8,12,28,0.75);backdrop-filter:blur(25px);
  border-radius:22px;padding:16px 20px;
  border:1px solid rgba(255,255,255,0.05);
  display:flex;flex-direction:column;gap:10px;
}
textarea{
  width:100%;background:transparent;border:none;color:#d0d8ff;
  font-size:.95rem;line-height:1.6;resize:none;outline:none;
  min-height:50px;font-family:inherit;
}
textarea::placeholder{color:#556;font-style:italic}
.btn-row{display:flex;gap:8px}
.btn{
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
  color:#8899cc;padding:10px 18px;border-radius:30px;font-size:.9rem;
  font-weight:500;cursor:pointer;backdrop-filter:blur(10px);
  transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;flex:1;
}
.btn.primary{background:rgba(120,100,220,0.25);border-color:rgba(140,120,240,0.4);color:#d0d8ff;font-weight:600}
.btn:active{transform:scale(0.95)}
.hint-text{font-size:.7rem;color:#445;text-align:center;margin-top:2px}
.galaxy-modal{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.85);backdrop-filter:blur(25px);
  z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding-top:max(env(safe-area-inset-top),20px);padding-bottom:max(env(safe-area-inset-bottom),20px);
}
.galaxy-modal.open{display:flex}
.galaxy-header{width:90%;max-width:400px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.batch-btn{
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);
  color:#8899cc;padding:8px 16px;border-radius:25px;font-size:.85rem;cursor:pointer;backdrop-filter:blur(10px);
}
.batch-actions{display:none;gap:8px}
.batch-actions.visible{display:flex}
.galaxy-content{
  width:90%;max-width:400px;max-height:60vh;overflow-y:auto;
  display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:20px;
  -webkit-overflow-scrolling:touch;
}
.galaxy-star{
  width:56px;height:56px;display:flex;align-items:center;justify-content:center;
  background:rgba(20,25,50,0.8);border-radius:14px;cursor:pointer;
  border:1px solid rgba(255,255,255,0.04);transition:all .2s;
}
.galaxy-star:active{transform:scale(0.9)}
.galaxy-star.selected{box-shadow:0 0 0 3px #ffd966}
.close-btn{margin-top:20px;color:#667799;background:transparent;border:1px solid #334;padding:8px 24px;border-radius:25px;cursor:pointer;font-size:.9rem}
.detail-modal{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.8);backdrop-filter:blur(20px);
  z-index:150;display:none;flex-direction:column;align-items:center;justify-content:center;
}
.detail-modal.open{display:flex}
.detail-card{
  background:rgba(8,12,28,0.92);border-radius:24px;padding:30px;
  border:1px solid rgba(255,255,255,0.08);max-width:320px;width:85%;text-align:center;
}
.detail-svg{margin-bottom:16px}
.detail-text{color:#c0c8ee;font-size:1rem;line-height:1.7;margin-bottom:12px;word-break:break-word;white-space:pre-wrap}
.detail-time{color:#445;font-size:.75rem;margin-bottom:20px}
.detail-close{color:#667799;background:transparent;border:1px solid #334;padding:8px 24px;border-radius:25px;cursor:pointer;font-size:.9rem}
.toast{
  position:fixed;bottom:140px;left:50%;transform:translateX(-50%);
  background:rgba(10,15,30,0.9);color:#d0d8ff;padding:10px 22px;
  border-radius:30px;z-index:200;opacity:0;transition:opacity .3s;
  pointer-events:none;font-size:.9rem;border:1px solid rgba(255,255,255,0.08);white-space:nowrap;
}
.toast.show{opacity:1}
</style>
</head>
<body>

<div id="canvas-container"></div>
<canvas id="fireworkCanvas"></canvas>

<div class="top-bar">
  <div class="top-left">
    <button id="soundToggle" class="icon-btn">🔇</button>
  </div>
  <div class="top-right">
    <div id="starDashboard" class="star-badge">
      <span class="star-emoji">⭐</span>
      <span id="starCount" class="star-count">0</span>
    </div>
    <button id="clearSkyBtn" class="icon-btn">🎆</button>
  </div>
</div>

<div class="ui-layer">
  <div class="input-card">
    <textarea id="textInput" placeholder="把烦恼丢进黑洞..." rows="2"></textarea>
    <div class="btn-row">
      <button id="throwBtn" class="btn primary">✦ 丢进黑洞</button>
    </div>
    <div class="hint-text">🎤 每吐槽一次，夜空里就多一颗星</div>
  </div>
</div>

<div id="galaxyModal" class="galaxy-modal">
  <div class="galaxy-header">
    <button id="batchDeleteBtn" class="batch-btn">⚡ 批量删除</button>
    <div id="batchActions" class="batch-actions">
      <button id="confirmBatchBtn" class="batch-btn" style="color:#ff8888;border-color:rgba(255,100,100,0.3)">确认删除</button>
      <button id="cancelBatchBtn" class="batch-btn">取消</button>
    </div>
  </div>
  <div id="galaxyContent" class="galaxy-content"></div>
  <button id="closeGalaxy" class="close-btn">关闭</button>
</div>

<div id="detailModal" class="detail-modal">
  <div class="detail-card">
    <div id="detailSvg" class="detail-svg"></div>
    <div id="detailText" class="detail-text"></div>
    <div id="detailTime" class="detail-time"></div>
    <button id="detailClose" class="detail-close">关闭</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.157.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const params = new URLSearchParams(window.location.search);
const sessionId = params.get('s') || 'default';
const STORAGE_KEY = `pengpeng_stars_${sessionId}`;

function migrateOldData() {
  const flag = `pengpeng_migrated_${sessionId}`;
  if (localStorage.getItem(flag)) return;
  const old = localStorage.getItem('pengpeng_stars');
  if (old && !localStorage.getItem(STORAGE_KEY)) localStorage.setItem(STORAGE_KEY, old);
  localStorage.setItem(flag, '1');
}
migrateOldData();

let starsData = [];
let starIdCounter = 0;
const spriteById = new Map();

function loadStars() {
  try { starsData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { starsData = []; }
  starIdCounter = starsData.reduce((m, s) => Math.max(m, s.id || 0), 0);
}
function saveStars() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(starsData)); } catch(e) {} }
function updateCounter() { document.getElementById('starCount').textContent = starsData.length; }

// ===== 声音 =====
let soundOn = false, audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playChime() {
  if (!soundOn) return;
  try {
    const ctx = getAudioCtx(); const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination); osc.type = 'sine';
    osc.frequency.setValueAtTime([523.25,659.25,783.99,880,1046.5][Math.floor(Math.random()*5)], ctx.currentTime);
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.5);
  } catch(e) {}
}
function playSweep() {
  if (!soundOn) return;
  try {
    const ctx = getAudioCtx(); const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination); osc.type = 'sine';
    osc.frequency.setValueAtTime(600, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.6);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.6);
  } catch(e) {}
}
document.getElementById('soundToggle').addEventListener('click', function(){
  soundOn = !soundOn; this.textContent = soundOn ? '🔊' : '🔇';
  if (soundOn) getAudioCtx();
});

// ===== Three.js =====
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 7;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0x1a1a3a, 1.2));
const keyLight = new THREE.PointLight(0x6677bb, 18, 10);
keyLight.position.set(1, 2, 4);
scene.add(keyLight);

// ===== 可见范围 =====
const FOV_RAD = 40 * Math.PI / 180, CAM_Z = 7;
function getVisibleBounds(zPlane) {
  const d = CAM_Z - zPlane;
  const halfH = d * Math.tan(FOV_RAD / 2);
  const halfW = halfH * (window.innerWidth / window.innerHeight);
  const totalH = halfH * 2, totalW = halfW * 2;
  return {
    xLeft: -halfW + 24/window.innerWidth * totalW,
    xRight: halfW - 24/window.innerWidth * totalW,
    yBottom: -halfH + 220/window.innerHeight * totalH,
    yTop: halfH - 100/window.innerHeight * totalH,
  };
}
function getVisibleStarPos() {
  const b = getVisibleBounds(0);
  return new THREE.Vector3(
    b.xLeft + Math.random() * (b.xRight - b.xLeft),
    b.yBottom + Math.random() * (b.yTop - b.yBottom),
    (Math.random() - 0.5) * 1.5
  );
}

// ===== 背景星纹理（尖锐角 + 桃心保留） =====
function makeBgTexture(type) {
  const c = document.createElement('canvas'); c.width = 48; c.height = 48;
  const ctx = c.getContext('2d'), cx = 24, cy = 24;
  if (type === 'circle') {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 9);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.3, 'rgba(255,255,255,0.6)');
    g.addColorStop(0.7, 'rgba(255,255,255,0.12)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI*2); ctx.fill();
  } else if (type === 'heart') {
    // 桃心保持不变
    ctx.save(); ctx.translate(cx, cy+1); ctx.scale(0.35, 0.35);
    const g1 = ctx.createRadialGradient(0, 0, 2, 0, 0, 28);
    g1.addColorStop(0, 'rgba(255,255,255,1)'); g1.addColorStop(0.35, 'rgba(255,255,255,0.55)');
    g1.addColorStop(0.7, 'rgba(255,255,255,0.12)'); g1.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g1;
    ctx.beginPath(); ctx.moveTo(0,-4);
    ctx.bezierCurveTo(-8,-24,-34,-16,-34,6);
    ctx.bezierCurveTo(-34,20,-16,30,0,36);
    ctx.bezierCurveTo(16,30,34,20,34,6);
    ctx.bezierCurveTo(34,-16,8,-24,0,-4);
    ctx.fill();
    const g2 = ctx.createRadialGradient(-3,-6,0,0,0,16);
    g2.addColorStop(0, 'rgba(255,255,255,0.9)'); g2.addColorStop(0.5, 'rgba(255,255,255,0.25)');
    g2.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g2; ctx.fill();
    ctx.restore();
  } else if (type === 'star4') {
    // ★ 恢复尖锐四角星
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 13);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.4, 'rgba(255,255,255,0.45)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const aO = (i*90-90)*Math.PI/180, aI = ((i*90)+45-90)*Math.PI/180;
      ctx.lineTo(cx+Math.cos(aO)*12, cy+Math.sin(aO)*12);
      ctx.lineTo(cx+Math.cos(aI)*3.5, cy+Math.sin(aI)*3.5);
    }
    ctx.closePath(); ctx.fill();
  } else if (type === 'star5') {
    // ★ 恢复尖锐五角星
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 12);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.4, 'rgba(255,255,255,0.45)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const aO = (i*72-90)*Math.PI/180, aI = ((i*72)+36-90)*Math.PI/180;
      ctx.lineTo(cx+Math.cos(aO)*11, cy+Math.sin(aO)*11);
      ctx.lineTo(cx+Math.cos(aI)*4.5, cy+Math.sin(aI)*4.5);
    }
    ctx.closePath(); ctx.fill();
  } else if (type === 'diamond') {
    // ★ 恢复尖锐菱形
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 11);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.4, 'rgba(255,255,255,0.45)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(cx, cy-11); ctx.lineTo(cx+5.5, cy); ctx.lineTo(cx, cy+11); ctx.lineTo(cx-5.5, cy);
    ctx.closePath(); ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}

// ===== 背景星颜色（16色系，高饱和版） =====
const bgStarColors = [
  () => [1.0, 0.85 + Math.random() * 0.15, 0.3 + Math.random() * 0.3],
  () => [1.0, 0.45 + Math.random() * 0.25, 0.55 + Math.random() * 0.25],
  () => [0.4 + Math.random() * 0.3, 0.75 + Math.random() * 0.2, 1.0],
  () => [0.7 + Math.random() * 0.25, 0.5 + Math.random() * 0.25, 1.0],
  () => [0.3 + Math.random() * 0.3, 0.85 + Math.random() * 0.15, 0.7 + Math.random() * 0.25],
  () => [1.0, 0.6 + Math.random() * 0.25, 0.4 + Math.random() * 0.3],
  () => [0.3 + Math.random() * 0.2, 0.6 + Math.random() * 0.2, 1.0],
  () => [1.0, 0.9 + Math.random() * 0.1, 0.5 + Math.random() * 0.3],
  () => [0.4 + Math.random() * 0.25, 1.0, 0.7 + Math.random() * 0.25],
  () => [0.85 + Math.random() * 0.15, 0.88 + Math.random() * 0.12, 1.0],
  () => [0.75+Math.random()*0.25, 0.82+Math.random()*0.18, 0.95+Math.random()*0.05],
  () => [0.55+Math.random()*0.25, 0.7+Math.random()*0.2, 0.95+Math.random()*0.05],
  () => [0.35+Math.random()*0.25, 0.8+Math.random()*0.15, 0.85+Math.random()*0.15],
  () => [0.7+Math.random()*0.2, 0.5+Math.random()*0.15, 0.95+Math.random()*0.05],
  () => [0.4+Math.random()*0.2, 0.65+Math.random()*0.2, 0.9+Math.random()*0.1],
  () => [0.95+Math.random()*0.05, 0.85+Math.random()*0.1, 0.4+Math.random()*0.3],
];
function pickBgColor() {
  return bgStarColors[Math.floor(Math.random() * bgStarColors.length)]();
}

const bgShapes = [
  { type:'circle', count:500, size:0.035 },
  { type:'heart',  count:250, size:0.055 },
  { type:'star4',  count:400, size:0.05 },
  { type:'star5',  count:350, size:0.045 },
  { type:'diamond',count:300, size:0.045 },
];
const bgGroups = [];
bgShapes.forEach(shape => {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(shape.count*3), col = new Float32Array(shape.count*3);
  for (let i = 0; i < shape.count*3; i+=3) {
    pos[i]=(Math.random()-0.5)*40; pos[i+1]=(Math.random()-0.5)*25; pos[i+2]=(Math.random()-0.5)*15-3;
    const [r,g,b] = pickBgColor(); col[i]=r; col[i+1]=g; col[i+2]=b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({
    size:shape.size, map:makeBgTexture(shape.type), vertexColors:true,
    blending:THREE.AdditiveBlending, depthWrite:false, transparent:true
  });
  const p = new THREE.Points(geo, mat); scene.add(p); bgGroups.push(p);
});

// ===== 黑洞核心 =====
const coreGroup = new THREE.Group();
[{r:0.38,t:0.015,color:0xffeedd,op:0.25,rx:Math.PI/2,ry:0},
 {r:0.55,t:0.004,color:0x8899dd,op:0.35,rx:Math.PI/2,ry:0},
 {r:0.72,t:0.007,color:0x99aaff,op:0.45,rx:Math.PI/3,ry:Math.PI/5},
 {r:0.95,t:0.005,color:0xaabbff,op:0.3,rx:Math.PI/2.5,ry:-Math.PI/4}
].forEach(cfg => {
  const ringGeo = new THREE.TorusGeometry(cfg.r, cfg.t, 32, 200);
  const ringMat = new THREE.MeshStandardMaterial({
    color:cfg.color, emissive:cfg.color, emissiveIntensity:0.4,
    roughness:0.25, metalness:0.95, transparent:true, opacity:cfg.op
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = cfg.rx; ring.rotation.y = cfg.ry; coreGroup.add(ring);
});
coreGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.32,32,32), new THREE.MeshBasicMaterial({color:0x010118})));
coreGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.07,16,16), new THREE.MeshBasicMaterial({color:0xffffff,blending:THREE.AdditiveBlending})));
scene.add(coreGroup);

// ===== 外圈光环 =====
const outerHaloGroup = new THREE.Group();
const outerRings = [];
[{r:1.5,t:0.008,color:0xeeddcc,op:0.25,rx:Math.PI/2.1,ry:0.15,speed:0.0004}].forEach(cfg => {
  const ringGeo = new THREE.TorusGeometry(cfg.r, cfg.t, 64, 300);
  const ringMat = new THREE.MeshBasicMaterial({color:cfg.color,transparent:true,opacity:cfg.op,blending:THREE.AdditiveBlending,depthWrite:false});
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = cfg.rx; ring.rotation.y = cfg.ry;
  ring.userData = {speed:cfg.speed, baseOpacity:cfg.op};
  outerHaloGroup.add(ring); outerRings.push(ring);
});
const accentDotsGeo = new THREE.BufferGeometry();
const accentPos = new Float32Array(90);
for (let i = 0; i < 90; i+=3) {
  const angle = Math.random()*Math.PI*2, radius = 1.5+(Math.random()-0.5)*0.08;
  accentPos[i]=Math.cos(angle)*radius; accentPos[i+1]=(Math.random()-0.5)*0.06; accentPos[i+2]=Math.sin(angle)*radius;
}
accentDotsGeo.setAttribute('position', new THREE.BufferAttribute(accentPos, 3));
outerHaloGroup.add(new THREE.Points(accentDotsGeo, new THREE.PointsMaterial({size:0.025,color:0xffffff,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0.7})));
scene.add(outerHaloGroup);

// ===== 诞生闪光 =====
const flashGeo = new THREE.SphereGeometry(0.01, 16, 16);
const flashMat = new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,blending:THREE.AdditiveBlending});
const flashMesh = new THREE.Mesh(flashGeo, flashMat);
scene.add(flashMesh);
let flashActive = false, flashTimer = 0;
function triggerFlash() { flashMesh.scale.set(0.1,0.1,0.1); flashMat.opacity=1; flashActive=true; flashTimer=0; }

// ===== 用户星星调色板 =====
const starPalettes = [
  {hue:210,sat:85,light:78},{hue:230,sat:80,light:76},{hue:260,sat:75,light:75},
  {hue:285,sat:70,light:78},{hue:305,sat:65,light:80},{hue:170,sat:75,light:75},
  {hue:190,sat:80,light:78},{hue:340,sat:75,light:80},{hue:45,sat:90,light:82},
  {hue:25,sat:85,light:78},{hue:150,sat:70,light:74},{hue:320,sat:65,light:80},
];
function pickColor() {
  const p = starPalettes[Math.floor(Math.random()*starPalettes.length)];
  return {
    hue: p.hue+Math.floor(Math.random()*20-10),
    sat: Math.min(100,Math.max(40,p.sat+Math.floor(Math.random()*12-6))),
    light: Math.min(90,Math.max(60,p.light+Math.floor(Math.random()*12-6))),
  };
}

// ===== 生成星星纹理（尖锐角 + 桃心保留） =====
function makeStarTexture(hue, sat, light, shapeType) {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  const cx = 64, cy = 64, size = 36;

  const starColor = `hsla(${hue},${sat}%,${Math.min(100,light+25)}%,0.95)`;
  const innerGlow = `hsla(${hue},${sat}%,${Math.min(100,light+35)}%,0.8)`;

  function drawStarPoly(n, outerR, innerR, outerOff, innerOff) {
    [innerOff, outerOff].forEach((off, idx) => {
      const color = idx === 0 ? innerGlow : starColor;
      const oR = outerR + (idx === 0 ? outerOff : 0);
      const iR = innerR + (idx === 0 ? innerOff : 0);
      ctx.fillStyle = color; ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const aO = (i*(360/n)-90)*Math.PI/180;
        const aI = ((i*(360/n))+(180/n)-90)*Math.PI/180;
        ctx.lineTo(cx+Math.cos(aO)*oR, cy+Math.sin(aO)*oR);
        ctx.lineTo(cx+Math.cos(aI)*iR, cy+Math.sin(aI)*iR);
      }
      ctx.closePath(); ctx.fill();
    });
  }

  // 桃心绘制函数
  function drawHeart(s, offsetY) {
    ctx.save(); ctx.translate(cx, cy + offsetY); ctx.scale(s/28, s/28);
    ctx.fillStyle = innerGlow; ctx.beginPath(); ctx.moveTo(0,-4);
    ctx.bezierCurveTo(-8,-24,-34,-16,-34,6);
    ctx.bezierCurveTo(-34,20,-16,30,0,36);
    ctx.bezierCurveTo(16,30,34,20,34,6);
    ctx.bezierCurveTo(34,-16,8,-24,0,-4);
    ctx.fill();
    ctx.fillStyle = starColor; ctx.beginPath(); ctx.moveTo(0,-4);
    ctx.bezierCurveTo(-6,-20,-26,-14,-26,5);
    ctx.bezierCurveTo(-26,17,-12,25,0,30);
    ctx.bezierCurveTo(12,25,26,17,26,5);
    ctx.bezierCurveTo(26,-14,6,-20,0,-4);
    ctx.fill();
    ctx.restore();
  }

  if (shapeType === 0) drawStarPoly(4, size*0.55, size*0.1, 4, 2);
  else if (shapeType === 1) drawStarPoly(5, size*0.5, size*0.16, 3, 2);
  else if (shapeType === 2) drawStarPoly(6, size*0.48, size*0.14, 3, 2);
  else if (shapeType === 3) {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, size*0.5);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.2, `hsla(${hue},${sat}%,${Math.min(100,light+35)}%,0.9)`);
    g.addColorStop(0.5, `hsla(${hue},${sat}%,${light+15}%,0.6)`);
    g.addColorStop(0.8, `hsla(${hue},${sat}%,${light}%,0.2)`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, size*0.5, 0, Math.PI*2); ctx.fill();
  } else if (shapeType === 4) {
    drawHeart(size*0.75, 0);
  } else {
    // ★ 菱形恢复尖锐
    ctx.fillStyle = innerGlow; ctx.beginPath();
    ctx.moveTo(cx, cy-size*0.65); ctx.lineTo(cx+size*0.3, cy);
    ctx.lineTo(cx, cy+size*0.65); ctx.lineTo(cx-size*0.3, cy);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = starColor; ctx.beginPath();
    ctx.moveTo(cx, cy-size*0.5); ctx.lineTo(cx+size*0.22, cy);
    ctx.lineTo(cx, cy+size*0.5); ctx.lineTo(cx-size*0.22, cy);
    ctx.closePath(); ctx.fill();
  }

  const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, size*0.15);
  coreGrad.addColorStop(0, '#ffffff');
  coreGrad.addColorStop(0.3, `hsla(${hue},${sat}%,${Math.min(100,light+40)}%,0.9)`);
  coreGrad.addColorStop(0.7, `hsla(${hue},${sat}%,${light+20}%,0.3)`);
  coreGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = coreGrad;
  ctx.beginPath(); ctx.arc(cx, cy, size*0.15, 0, Math.PI*2); ctx.fill();

  return new THREE.CanvasTexture(canvas);
}

// ===== SVG =====
function makeStarSVG(hue, sat, light, shapeType) {
  const cx = 24, cy = 24, size = 20;
  const fill = `hsl(${hue},${sat}%,${light}%)`;

  function starPointsStr(n, outerR, innerR) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const aO = (i*(360/n)-90)*Math.PI/180, aI = ((i*(360/n))+(180/n)-90)*Math.PI/180;
      pts.push(`${cx+Math.cos(aO)*outerR},${cy+Math.sin(aO)*outerR}`);
      pts.push(`${cx+Math.cos(aI)*innerR},${cy+Math.sin(aI)*innerR}`);
    }
    return pts.join(' ');
  }

  let inner = '';
  if (shapeType === 0) inner = `<polygon points="${starPointsStr(4,size*0.9,size*0.2)}" fill="${fill}" style="filter:drop-shadow(0 0 4px ${fill})"/>`;
  else if (shapeType === 1) inner = `<polygon points="${starPointsStr(5,size*0.85,size*0.35)}" fill="${fill}" style="filter:drop-shadow(0 0 4px ${fill})"/>`;
  else if (shapeType === 2) inner = `<polygon points="${starPointsStr(6,size*0.8,size*0.3)}" fill="${fill}" style="filter:drop-shadow(0 0 4px ${fill})"/>`;
  else if (shapeType === 3) inner = `<circle cx="24" cy="24" r="14" fill="${fill}" style="filter:drop-shadow(0 0 4px ${fill})"/><circle cx="24" cy="24" r="6" fill="white" opacity="0.5"/>`;
  else if (shapeType === 4) {
    inner = `<g transform="translate(24,25) scale(0.5)"><path d="M0,-4 C-8,-24 -34,-16 -34,6 C-34,20 -16,30 0,36 C16,30 34,20 34,6 C34,-16 8,-24 0,-4Z" fill="${fill}" style="filter:drop-shadow(0 0 4px ${fill})"/></g>`;
  } else {
    inner = `<polygon points="24,4 30,24 24,44 18,24" fill="${fill}" style="filter:drop-shadow(0 0 4px ${fill})"/>`;
  }

  return `<svg width="48" height="48" viewBox="0 0 48 48">${inner}</svg>`;
}

// ===== 用户3D星星 =====
const generatedStarsGroup = new THREE.Group();
scene.add(generatedStarsGroup);

function createSprite3D(hue, sat, light, shape, withAnimation) {
  const tex = makeStarTexture(hue, sat, light, shape);
  const material = new THREE.SpriteMaterial({map:tex, blending:THREE.AdditiveBlending, depthWrite:false, transparent:true});
  const sprite = new THREE.Sprite(material);
  const targetPos = getVisibleStarPos();
  const sz = 0.4 + Math.random() * 0.35;

  const base = {
    baseY: targetPos.y, baseScale: sz,
    breathePhase: Math.random()*Math.PI*2, breatheSpeed: 0.4+Math.random()*0.6,
    floatAmp: 0.04+Math.random()*0.08, floatPhase: Math.random()*Math.PI*2,
    floatSpeed: 0.3+Math.random()*0.4, dying: false
  };

  if (withAnimation) {
    sprite.position.set(0,0,0); sprite.scale.set(0.01,0.01,1);
    sprite.userData = {...base, targetPos:targetPos.clone(), spawning:true, spawnProgress:0};
  } else {
    sprite.position.copy(targetPos); sprite.scale.set(sz,sz,1);
    sprite.userData = {...base, spawning:false, spawnProgress:1};
  }
  return sprite;
}

// ===== 2D粒子（尖锐角版） =====
const fwCanvas = document.getElementById('fireworkCanvas');
const fwCtx = fwCanvas.getContext('2d');
let fwParticles = [], fwAnimId = null;
function resizeFW() { fwCanvas.width = window.innerWidth; fwCanvas.height = window.innerHeight; }
resizeFW();

const burstShapes = ['star4','star5','heart','diamond','circle'];

function drawParticleShape(ctx, x, y, size, shape, color, alpha) {
  ctx.globalAlpha = alpha; ctx.fillStyle = color;
  if (shape === 'star4') {
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const aO = (i*90-90)*Math.PI/180, aI = ((i*90)+45-90)*Math.PI/180;
      ctx.lineTo(x+Math.cos(aO)*size, y+Math.sin(aO)*size);
      ctx.lineTo(x+Math.cos(aI)*size*0.35, y+Math.sin(aI)*size*0.35);
    }
    ctx.closePath(); ctx.fill();
  } else if (shape === 'star5') {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const aO = (i*72-90)*Math.PI/180, aI = ((i*72)+36-90)*Math.PI/180;
      ctx.lineTo(x+Math.cos(aO)*size, y+Math.sin(aO)*size);
      ctx.lineTo(x+Math.cos(aI)*size*0.4, y+Math.sin(aI)*size*0.4);
    }
    ctx.closePath(); ctx.fill();
  } else if (shape === 'heart') {
    // 桃心保留圆润
    ctx.save(); ctx.translate(x, y); ctx.scale(size/14, size/14);
    ctx.beginPath(); ctx.moveTo(0,-4);
    ctx.bezierCurveTo(-8,-24,-34,-16,-34,6);
    ctx.bezierCurveTo(-34,20,-16,30,0,36);
    ctx.bezierCurveTo(16,30,34,20,34,6);
    ctx.bezierCurveTo(34,-16,8,-24,0,-4);
    ctx.fill(); ctx.restore();
  } else if (shape === 'diamond') {
    ctx.beginPath(); ctx.moveTo(x,y-size); ctx.lineTo(x+size*0.5,y); ctx.lineTo(x,y+size); ctx.lineTo(x-size*0.5,y);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI*2); ctx.fill();
  }
}

function launchBirthBurst(color) {
  const cx = fwCanvas.width/2, cy = fwCanvas.height/2 - 20;
  for (let j = 0; j < 60; j++) {
    const angle = Math.random()*Math.PI*2;
    const speed = 0.6 + Math.random()*1.8;
    fwParticles.push({
      x:cx, y:cy, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
      alpha:1, color, size:3+Math.random()*6, shape:burstShapes[Math.floor(Math.random()*burstShapes.length)],
      delay:0, born:true, elapsed:0,
      decay:0.002, gravity:0.006,
      rotSpeed:(Math.random()-0.5)*0.04
    });
  }
  if (!fwAnimId) animateFW();
}

function launchFireworks() {
  if (fwAnimId) { cancelAnimationFrame(fwAnimId); fwAnimId = null; }
  fwParticles = [];
  const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff6eb4','#c77dff','#45caff','#ffad45'];
  const w = fwCanvas.width, h = fwCanvas.height;
  for (let i = 0; i < 8; i++) {
    const x = Math.random()*w*0.5+w*0.25, y = Math.random()*h*0.3+h*0.1;
    const color = colors[i % colors.length];
    const delay = i * 600;
    const count = 55 + Math.floor(Math.random()*25);
    for (let j = 0; j < count; j++) {
      const angle = Math.random()*Math.PI*2;
      const speed = 0.5 + Math.random()*1.8;
      fwParticles.push({
        x, y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
        alpha:1, color, size:3+Math.random()*5,
        shape:burstShapes[Math.floor(Math.random()*burstShapes.length)],
        delay, born:false, elapsed:0,
        decay:0.0018, gravity:0.008,
        rotSpeed:(Math.random()-0.5)*0.04
      });
    }
  }
  fwCtx.clearRect(0, 0, w, h);
  animateFW();
}

function animateFW() {
  fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
  let alive = false;
  fwParticles = fwParticles.filter(p => {
    if (!p.born) { p.elapsed += 16; if (p.elapsed < p.delay) { alive = true; return true; } p.born = true; }
    p.x += p.vx; p.y += p.vy; p.vy += (p.gravity||0.008); p.vx *= 0.998; p.alpha -= (p.decay||0.002);
    if (p.alpha <= 0) return false;
    drawParticleShape(fwCtx, p.x, p.y, p.size, p.shape, p.color, p.alpha);
    alive = true; return true;
  });
  fwCtx.globalAlpha = 1;
  if (alive) { fwAnimId = requestAnimationFrame(animateFW); }
  else { fwAnimId = null; fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height); }
}

// ===== 交互逻辑 =====
function addGeneratedStar(text) {
  const id = ++starIdCounter;
  const {hue, sat, light} = pickColor();
  const shape = Math.floor(Math.random() * 6);
  const sprite = createSprite3D(hue, sat, light, shape, true);
  generatedStarsGroup.add(sprite); spriteById.set(id, sprite);
  triggerFlash();
  launchBirthBurst(`hsl(${hue},${sat}%,${Math.min(90,light+15)}%)`);
  const svgStr = makeStarSVG(hue, sat, light, shape);
  starsData.push({id, svg:svgStr, text:text.slice(0,200), time:Date.now(), hue, sat, light, shape});
  saveStars(); updateCounter(); playChime();
}

function restoreStars3D() {
  starsData.forEach(star => {
    if (!star.id) star.id = ++starIdCounter;
    if (spriteById.has(star.id)) return;
    const hue = star.hue??Math.floor(Math.random()*360), sat = star.sat??65, light = star.light??60;
    const shape = (star.shape !== undefined) ? star.shape : Math.floor(Math.random()*6);
    if (!star.svg || star.shape === undefined) star.svg = makeStarSVG(hue, sat, light, shape);
    const sprite = createSprite3D(hue, sat, light, shape, false);
    generatedStarsGroup.add(sprite); spriteById.set(star.id, sprite);
  });
  saveStars();
}

document.getElementById('throwBtn').addEventListener('click', () => {
  const text = document.getElementById('textInput').value.trim();
  if (!text) { showToast('写点什么再丢进去吧'); return; }
  document.getElementById('textInput').value = '';
  document.getElementById('textInput').style.height = 'auto';
  document.getElementById('textInput').blur();
  window.scrollTo(0, 0);
  addGeneratedStar(text);
  showToast('✨ 星星已生成');
});
document.getElementById('textInput').addEventListener('input', function() {
  this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

let batchMode = false, selectedIds = new Set();
function renderGalaxy() {
  const content = document.getElementById('galaxyContent');
  content.innerHTML = '';
  if (starsData.length === 0) {
    content.innerHTML = '<div style="color:#556;text-align:center;padding:40px;width:100%">还没有星星，去吐槽吧</div>';
    return;
  }
  starsData.forEach(star => {
    const div = document.createElement('div');
    div.className = 'galaxy-star' + (batchMode && selectedIds.has(star.id) ? ' selected' : '');
    div.innerHTML = star.svg;
    div.addEventListener('click', () => {
      if (batchMode) {
        if (selectedIds.has(star.id)) { selectedIds.delete(star.id); div.classList.remove('selected'); }
        else { selectedIds.add(star.id); div.classList.add('selected'); }
      } else { showDetail(star); }
    });
    content.appendChild(div);
  });
}

function showDetail(star) {
  document.getElementById('detailSvg').innerHTML = star.svg.replace('width="48" height="48"', 'width="80" height="80"');
  document.getElementById('detailText').textContent = star.text;
  const d = new Date(star.time);
  document.getElementById('detailTime').textContent = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  document.getElementById('detailModal').classList.add('open');
}
document.getElementById('detailClose').addEventListener('click', () => document.getElementById('detailModal').classList.remove('open'));
document.getElementById('detailModal').addEventListener('click', e => { if(e.target.id==='detailModal') document.getElementById('detailModal').classList.remove('open'); });

function showGalaxy() { if(batchMode) exitBatch(); renderGalaxy(); document.getElementById('galaxyModal').classList.add('open'); }
function hideGalaxy() { document.getElementById('galaxyModal').classList.remove('open'); if(batchMode) exitBatch(); }
document.getElementById('starDashboard').addEventListener('click', showGalaxy);
document.getElementById('closeGalaxy').addEventListener('click', hideGalaxy);
document.getElementById('galaxyModal').addEventListener('click', e => { if(e.target.id==='galaxyModal') hideGalaxy(); });

const batchBtn = document.getElementById('batchDeleteBtn');
const batchActions = document.getElementById('batchActions');
function enterBatch() { batchMode=true; selectedIds.clear(); batchBtn.style.display='none'; batchActions.classList.add('visible'); renderGalaxy(); }
function exitBatch() { batchMode=false; selectedIds.clear(); batchBtn.style.display='inline-block'; batchActions.classList.remove('visible'); renderGalaxy(); }
batchBtn.addEventListener('click', enterBatch);
document.getElementById('cancelBatchBtn').addEventListener('click', exitBatch);
document.getElementById('confirmBatchBtn').addEventListener('click', () => {
  if (selectedIds.size === 0) { showToast('还没有选择星星'); return; }
  selectedIds.forEach(id => { const s = spriteById.get(id); if(s){generatedStarsGroup.remove(s);spriteById.delete(id);} });
  starsData = starsData.filter(s => !selectedIds.has(s.id));
  saveStars(); updateCounter(); showToast(`已删除 ${selectedIds.size} 颗星星`); exitBatch(); renderGalaxy();
});

let clearing = false;
document.getElementById('clearSkyBtn').addEventListener('click', () => {
  if (starsData.length === 0) { showToast('夜空已经是空的了'); return; }
  if (!confirm('清空所有星星？')) return;
  generatedStarsGroup.children.forEach(s => { s.userData.dying = true; });
  clearing = true; playSweep(); launchFireworks();
  setTimeout(() => {
    while (generatedStarsGroup.children.length > 0) generatedStarsGroup.remove(generatedStarsGroup.children[0]);
    spriteById.clear(); starsData = []; saveStars(); updateCounter(); clearing = false;
    showToast('星空已清空');
  }, 4000);
});

function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

// ===== 动画循环 =====
function animate() {
  requestAnimationFrame(animate);
  coreGroup.children.forEach((child, i) => {
    if (child.isMesh && child.geometry.type === 'TorusGeometry') {
      child.rotation.z += 0.0008*(i+1); child.rotation.x += 0.0006*(i+1);
    }
  });
  outerRings.forEach(ring => {
    ring.rotation.z += ring.userData.speed;
    ring.material.opacity = ring.userData.baseOpacity + Math.sin(Date.now()*0.001+ring.position.x)*0.03;
  });
  outerHaloGroup.rotation.x = Math.sin(Date.now()*0.00015)*0.03;
  outerHaloGroup.rotation.y += 0.0001;

  const time = Date.now() * 0.001;

  // 背景星呼吸
  bgGroups.forEach((points, i) => {
    const freq = 0.3 + i * 0.08;
    const phase = i * 1.2;
    const breathe = 0.5 + Math.sin(time * freq + phase) * 0.5;
    points.material.opacity = 0.4 + breathe * 0.5;
    points.rotation.y += 0.00004 * (1 + i * 0.3);
  });

  if (flashActive) {
    flashTimer += 0.04;
    if (flashTimer < 1) {
      const s = easeOutCubic(flashTimer)*2;
      flashMesh.scale.set(s,s,s); flashMat.opacity = Math.max(0, 1-flashTimer*1.2);
    } else { flashMat.opacity = 0; flashActive = false; }
  }

  generatedStarsGroup.children.forEach(sprite => {
    const ud = sprite.userData;
    if (ud.dying) {
      sprite.position.x*=0.88; sprite.position.y*=0.88; sprite.position.z*=0.88;
      sprite.scale.multiplyScalar(0.94); sprite.material.opacity*=0.92; return;
    }
    if (ud.spawning) {
      ud.spawnProgress += 0.025;
      const t = easeOutQuart(Math.min(ud.spawnProgress, 1));
      sprite.position.lerpVectors(new THREE.Vector3(0,0,0), ud.targetPos, t);
      const s = ud.baseScale*t; sprite.scale.set(s,s,1); sprite.material.opacity = Math.min(t*1.5, 1);
      if (ud.spawnProgress >= 1) {
        ud.spawning = false; sprite.position.copy(ud.targetPos);
        sprite.scale.set(ud.baseScale,ud.baseScale,1); sprite.material.opacity = 1;
      }
      return;
    }
    const breathe = 0.5+Math.abs(Math.sin(time*ud.breatheSpeed+ud.breathePhase))*0.5;
    sprite.material.opacity = 0.6+breathe*0.4;
    const s = ud.baseScale*(0.9+breathe*0.2);
    sprite.scale.setScalar(s);
    sprite.position.y = ud.baseY + Math.sin(time*ud.floatSpeed+ud.floatPhase)*ud.floatAmp;
  });

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight); resizeFW();
});

loadStars(); updateCounter(); restoreStars3D();
</script>
