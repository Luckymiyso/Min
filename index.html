<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>碰碰星 · 你的随身情绪充电站</title>
  <style>
    :root {
      --neon-cyan: #00f0ff;
      --neon-pink: #ff2d95;
      --neon-purple: #b44aff;
      --neon-gold: #ffd966;
      --glass-bg: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.1);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #050510;
      min-height:100vh; min-height:100dvh;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      font-family: -apple-system, sans-serif;
      padding: 20px;
      padding-top: calc(20px + env(safe-area-inset-top));
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      padding-left: calc(20px + env(safe-area-inset-left));
      padding-right: calc(20px + env(safe-area-inset-right));
      overflow-x:hidden; color:#e0e0e0;
      -webkit-tap-highlight-color: transparent; user-select:none; position:relative;
    }

    /* ===== 3D星空Canvas ===== */
    #starfieldCanvas {
      position:fixed; top:0; left:0; width:100%; height:100%;
      z-index:0; pointer-events:none;
    }

    /* ===== 网格地面Canvas ===== */
    #gridCanvas {
      position:fixed; top:0; left:0; width:100%; height:100%;
      z-index:1; pointer-events:none;
    }

    /* ===== 背景星星容器 ===== */
    .bg-stars-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:2; }
    .bg-star {
      position:absolute;
      animation: starPulse 2s infinite ease-in-out, starFloat 8s infinite ease-in-out;
      will-change:transform;
      filter: drop-shadow(0 0 4px currentColor);
    }
    @keyframes starPulse { 0%{transform:scale(1);opacity:0.7} 50%{transform:scale(1.4);opacity:1} 100%{transform:scale(1);opacity:0.7} }
    @keyframes starFloat { 0%{transform:translateY(0)} 50%{transform:translateY(-20px)} 100%{transform:translateY(0)} }
    .bg-star.vanishing {
      transition: transform 0.6s ease-in, opacity 0.6s ease-in;
      transform: scale(0) rotate(360deg) !important;
      opacity: 0 !important;
    }

    /* ===== 散落星星动画 ===== */
    @keyframes starScatter {
      0%{transform:translate(0,0) scale(0);opacity:0}
      15%{opacity:1;transform:translate(var(--dx15),var(--dy15)) scale(1.2)}
      40%{opacity:0.9;transform:translate(var(--dx40),var(--dy40)) scale(0.8)}
      100%{opacity:0;transform:translate(var(--dx100),var(--dy100)) scale(0.2)}
    }
    .scatter-star { position:fixed; z-index:28; pointer-events:none; animation:starScatter 1.8s ease-out forwards; }

    /* ===== 主容器 ===== */
    .container { position:relative; z-index:10; width:100%; max-width:400px; display:flex; flex-direction:column; align-items:center; gap:28px; }

    /* ===== 标题 ===== */
    .title { text-align:center; margin-bottom:6px; line-height:1.2; }
    .title-main {
      display:block; font-size:2.6rem; font-weight:800; letter-spacing:8px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      filter: drop-shadow(0 0 25px rgba(0,240,255,0.4));
    }
    .title-sub { display:block; font-size:0.78rem; font-weight:300; color:rgba(255,255,255,0.35); letter-spacing:6px; margin-top:6px; text-transform:uppercase; }

    /* ===== 3D黑洞 ===== */
    .black-hole-wrapper {
      position:relative; width:200px; height:200px;
      perspective: 600px;
    }
    .black-hole-scene {
      position:absolute; top:0; left:0; width:100%; height:100%;
      transform-style: preserve-3d;
      transform: rotateX(15deg);
    }
    .black-hole {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      width:110px; height:110px; border-radius:50%;
      background: radial-gradient(circle at 40% 35%, #151530, #000000 70%);
      box-shadow:
        0 0 60px rgba(180,74,255,0.6),
        0 0 120px rgba(0,240,255,0.2),
        inset 0 0 40px 10px rgba(0,0,0,1),
        inset 0 0 60px rgba(180,74,255,0.3);
      z-index:3;
      animation: holePulse 3s ease-in-out infinite;
    }
    @keyframes holePulse {
      0%,100% { box-shadow: 0 0 60px rgba(180,74,255,0.6), 0 0 120px rgba(0,240,255,0.2), inset 0 0 40px 10px rgba(0,0,0,1), inset 0 0 60px rgba(180,74,255,0.3); }
      50% { box-shadow: 0 0 80px rgba(180,74,255,0.8), 0 0 150px rgba(0,240,255,0.35), inset 0 0 50px 10px rgba(0,0,0,1), inset 0 0 80px rgba(180,74,255,0.4); }
    }
    .accretion-disk {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      width:170px; height:170px; border-radius:50%;
      border:3px solid transparent;
      border-top-color:rgba(0,240,255,0.6);
      border-right-color:rgba(0,240,255,0.15);
      animation:spin 3s linear infinite; z-index:2;
      filter:blur(1px);
      box-shadow: 0 0 15px rgba(0,240,255,0.2);
    }
    .accretion-disk:nth-child(2) {
      width:150px; height:150px;
      border-width:2px;
      border-top-color:rgba(255,45,149,0.5);
      border-left-color:rgba(255,45,149,0.1);
      animation-duration:5s; animation-direction:reverse;
      box-shadow: 0 0 12px rgba(255,45,149,0.15);
    }
    .accretion-disk:nth-child(3) {
      width:190px; height:190px;
      border-width:1px;
      border-top-color:rgba(180,74,255,0.3);
      border-right-color:rgba(180,74,255,0.08);
      animation-duration:8s;
      box-shadow: 0 0 8px rgba(180,74,255,0.1);
    }
    /* 黑洞内部深度环 */
    .hole-depth-ring {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      border-radius:50%; border:1px solid;
      z-index:3; pointer-events:none;
      animation: depthSpin 4s linear infinite;
    }
    .hole-depth-ring:nth-child(4) {
      width:80px; height:80px;
      border-color: rgba(180,74,255,0.25);
    }
    .hole-depth-ring:nth-child(5) {
      width:55px; height:55px;
      border-color: rgba(0,240,255,0.2);
      animation-direction: reverse; animation-duration: 6s;
    }
    .hole-depth-ring:nth-child(6) {
      width:30px; height:30px;
      border-color: rgba(255,255,255,0.1);
      animation-duration: 3s;
    }
    @keyframes spin { from{transform:translate(-50%,-50%) rotate(0deg)} to{transform:translate(-50%,-50%) rotate(360deg)} }
    @keyframes depthSpin { from{transform:translate(-50%,-50%) rotateX(70deg) rotateZ(0deg)} to{transform:translate(-50%,-50%) rotateX(70deg) rotateZ(360deg)} }

    /* ===== 全息输入卡片 ===== */
    .input-area {
      width:100%;
      background: linear-gradient(135deg, rgba(0,240,255,0.04), rgba(180,74,255,0.04), rgba(255,45,149,0.03));
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border-radius:24px; padding:18px;
      border:1px solid var(--glass-border);
      display:flex; flex-direction:column; gap:14px;
      position:relative; overflow:hidden;
      transform-style:preserve-3d; perspective:800px;
      transition: box-shadow 0.3s;
    }
    /* 顶部霓虹线 */
    .input-area::before {
      content:''; position:absolute;
      top:0; left:10%; right:10%; height:2px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-pink), transparent);
      border-radius:2px;
    }
    /* 全息彩虹反光 */
    .input-area::after {
      content:''; position:absolute;
      top:-50%; left:-50%; width:200%; height:200%;
      background: linear-gradient(
        125deg,
        transparent 30%,
        rgba(0,240,255,0.04) 35%,
        rgba(180,74,255,0.04) 40%,
        rgba(255,45,149,0.03) 45%,
        transparent 50%
      );
      animation: holoShift 6s ease-in-out infinite;
      pointer-events:none;
    }
    @keyframes holoShift {
      0%,100% { transform: translateX(-30%) translateY(-10%); }
      50% { transform: translateX(30%) translateY(10%); }
    }
    .input-area:active {
      box-shadow: 0 0 40px rgba(0,240,255,0.15), 0 0 80px rgba(255,45,149,0.08);
    }
    textarea {
      width:100%; background:transparent; border:none; color:#ddd; font-size:1rem;
      line-height:1.5; resize:none; outline:none; font-family:inherit; min-height:60px;
      position:relative; z-index:1;
    }
    textarea::placeholder { color:#444; font-style:italic; }

    /* ===== 按钮 ===== */
    .button-row { display:flex; gap:12px; align-items:center; position:relative; z-index:1; }
    .btn {
      background:var(--glass-bg); border:1px solid rgba(255,255,255,0.15);
      color:#ccc; padding:13px 20px; border-radius:40px; font-size:0.95rem; font-weight:500;
      cursor:pointer; backdrop-filter:blur(10px); transition:all 0.25s;
      display:flex; align-items:center; justify-content:center; gap:6px; flex:1; white-space:nowrap;
    }
    .btn.primary {
      background: linear-gradient(135deg, rgba(0,240,255,0.18), rgba(180,74,255,0.18));
      border-color: rgba(0,240,255,0.5);
      color: var(--neon-cyan); font-weight:600; letter-spacing:2px;
      box-shadow: 0 0 20px rgba(0,240,255,0.15), inset 0 0 15px rgba(0,240,255,0.05);
    }
    .btn.primary:active {
      transform:scale(0.96);
      background: linear-gradient(135deg, rgba(0,240,255,0.3), rgba(180,74,255,0.3));
      box-shadow: 0 0 35px rgba(0,240,255,0.3), inset 0 0 20px rgba(0,240,255,0.1);
    }
    .btn:active { transform:scale(0.96); background:rgba(255,255,255,0.1); }
    .btn:disabled { opacity:0.3; pointer-events:none; }
    .voice-btn {
      background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.15);
      border-radius:50%; width:46px; height:46px; display:flex; align-items:center;
      justify-content:center; cursor:pointer; flex:0 0 auto; font-size:1.3rem;
      transition:all 0.2s;
    }
    .voice-btn:active { transform:scale(0.92); border-color:var(--neon-cyan); color:var(--neon-cyan); }

    /* ===== 提示文字 ===== */
    .hint-text { font-size:0.72rem; color:rgba(255,255,255,0.25); text-align:center; margin-top:-10px; letter-spacing:1px; }

    /* ===== 右上角星数 ===== */
    .top-right-area {
      position:fixed; z-index:20; display:flex; gap:10px; align-items:center;
      top: calc(16px + env(safe-area-inset-top));
      right: calc(16px + env(safe-area-inset-right));
    }
    .star-dashboard {
      background:rgba(8,8,20,0.85); backdrop-filter:blur(15px);
      border-radius:30px; padding:8px 16px;
      display:flex; align-items:center; gap:10px;
      border:1px solid rgba(0,240,255,0.3);
      box-shadow:0 0 25px rgba(0,240,255,0.12), inset 0 0 10px rgba(0,240,255,0.03);
      cursor:pointer; transition:all 0.3s;
    }
    .star-dashboard:active { box-shadow:0 0 35px rgba(0,240,255,0.25); transform:scale(0.96); }
    .star-emoji { font-size:1.4rem; animation:starGlow 2s infinite alternate; }
    @keyframes starGlow { 0%{filter:drop-shadow(0 0 4px rgba(0,240,255,0.6))} 100%{filter:drop-shadow(0 0 12px rgba(0,240,255,0.9))} }
    .star-count { font-weight:700; font-size:1.1rem; color:var(--neon-cyan); text-shadow:0 0 10px rgba(0,240,255,0.5); }

    /* ===== 声音开关 ===== */
    .sound-toggle {
      position:fixed; z-index:20;
      top: calc(16px + env(safe-area-inset-top));
      right: calc(70px + env(safe-area-inset-right));
      width:38px; height:38px; border-radius:50%;
      background:rgba(8,8,20,0.85); backdrop-filter:blur(10px);
      border:1px solid rgba(0,240,255,0.15);
      display:flex; align-items:center; justify-content:center;
      font-size:1rem; cursor:pointer; color:#555; transition:all 0.3s;
    }
    .sound-toggle.on { color:var(--neon-cyan); border-color:rgba(0,240,255,0.3); }
    .sound-toggle:active { transform:scale(0.9); }

    /* ===== 清空星空按钮 ===== */
    .clear-btn {
      position:fixed; z-index:20;
      top: calc(60px + env(safe-area-inset-top));
      right: calc(16px + env(safe-area-inset-right));
      background:rgba(60,15,15,0.6); backdrop-filter:blur(10px);
      border:1px solid rgba(255,80,80,0.25);
      border-radius:30px; padding:7px 14px;
      color:#e88; font-size:0.75rem; cursor:pointer;
      transition:all 0.3s;
    }
    .clear-btn:active { transform:scale(0.94); background:rgba(100,20,20,0.7); border-color:#ff5555; }

    /* ===== 星系弹窗 ===== */
    .galaxy-modal {
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(5,5,16,0.92); backdrop-filter:blur(15px); z-index:100;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      opacity:0; pointer-events:none; transition:opacity 0.3s;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .galaxy-modal.open { opacity:1; pointer-events:auto }
    .galaxy-header { width:90%; max-width:400px; display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .batch-delete-btn {
      background:var(--glass-bg); border:1px solid rgba(255,255,255,0.2);
      color:#ccc; padding:8px 16px; border-radius:25px; font-size:0.85rem;
      cursor:pointer; backdrop-filter:blur(10px); transition:all 0.2s;
    }
    .batch-delete-btn.active { background:rgba(255,80,80,0.3); border-color:#ff5555; }
    .batch-actions { display:none; gap:10px; }
    .batch-actions.visible { display:flex; }
    .galaxy-content {
      width:90%; max-width:400px; max-height:60vh; overflow-y:auto;
      display:flex; flex-wrap:wrap; gap:16px; justify-content:center; padding:20px;
    }
    .galaxy-star {
      width:56px; height:56px; display:flex; align-items:center; justify-content:center;
      background:rgba(10,10,25,0.7); border-radius:14px; cursor:pointer;
      transition:transform 0.2s, box-shadow 0.2s; position:relative;
      border:1px solid rgba(255,255,255,0.06);
    }
    .galaxy-star.selected { box-shadow:0 0 0 3px var(--neon-cyan); border-color:var(--neon-cyan); }
    .galaxy-star:active { transform:scale(0.92); }

    /* ===== 星星详情弹窗 ===== */
    .star-detail-modal {
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(5,5,16,0.92); backdrop-filter:blur(15px); z-index:120;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      opacity:0; pointer-events:none; transition:opacity 0.25s;
    }
    .star-detail-modal.open { opacity:1; pointer-events:auto }
    .star-detail-card {
      background:rgba(12,12,28,0.95); border-radius:22px; padding:28px 24px;
      width:85%; max-width:360px; border:1px solid rgba(0,240,255,0.15);
      text-align:center; display:flex; flex-direction:column; align-items:center; gap:20px;
      position:relative; overflow:hidden;
    }
    .star-detail-card::before {
      content:''; position:absolute; top:0; left:20%; right:20%; height:2px;
      background:linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), transparent);
    }
    .star-detail-card .big-star { width:72px; height:72px; display:flex; align-items:center; justify-content:center }
    .star-detail-card .memory-text { color:#ccc; font-size:0.95rem; line-height:1.6; max-height:120px; overflow-y:auto; padding:0 8px; word-break:break-word; }
    .star-detail-card .memory-time { color:#555; font-size:0.7rem; letter-spacing:1px; }
    .star-detail-card .btn-row { display:flex; gap:14px }
    .star-detail-card .btn-small {
      background:var(--glass-bg); border:1px solid rgba(255,255,255,0.15);
      color:#aaa; padding:10px 22px; border-radius:30px; font-size:0.85rem;
      cursor:pointer; transition:all 0.2s;
    }
    .star-detail-card .btn-small.danger { border-color:rgba(255,80,80,0.3); color:#e88; }
    .star-detail-card .btn-small:active { transform:scale(0.94); background:rgba(255,255,255,0.1); }
    .close-btn {
      margin-top:20px; color:#888; background:transparent;
      border:1px solid rgba(255,255,255,0.15); padding:8px 24px; border-radius:25px; cursor:pointer;
      transition:all 0.2s;
    }
    .close-btn:active { border-color:var(--neon-cyan); color:var(--neon-cyan); }
    .empty-hint { color:#444; text-align:center; padding:40px; width:100%; font-size:0.9rem; line-height:1.8; }

    /* ===== Toast ===== */
    .toast {
      position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
      background:rgba(8,8,20,0.95); color:#ddd; padding:10px 24px; border-radius:30px;
      font-size:0.88rem; z-index:200; opacity:0; transition:opacity 0.3s; pointer-events:none;
      border:1px solid rgba(0,240,255,0.25);
      box-shadow:0 0 25px rgba(0,240,255,0.1);
    }
    .toast.show { opacity:1; }

    /* ===== 左上角反馈 ===== */
    .feedback-trigger {
      position:fixed; z-index:50; width:38px; height:38px;
      border-radius:50%; background:rgba(8,8,20,0.85); backdrop-filter:blur(10px);
      border:1px solid rgba(0,240,255,0.1);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; font-size:1rem; color:#555; transition:all 0.3s;
      top: calc(16px + env(safe-area-inset-top));
      left: calc(16px + env(safe-area-inset-left));
    }
    .feedback-trigger:active { background:rgba(20,20,40,0.9); transform:scale(0.92); color:var(--neon-cyan); border-color:var(--neon-cyan); }
    .feedback-modal {
      position:fixed; top:70px; left:20px; z-index:60;
      background:rgba(10,10,22,0.97); backdrop-filter:blur(25px);
      border-radius:18px; padding:22px 20px 18px; border:1px solid rgba(0,240,255,0.12);
      box-shadow:0 12px 40px rgba(0,0,0,0.6), 0 0 30px rgba(0,240,255,0.05); width:250px;
      opacity:0; pointer-events:none; transform:translateY(-8px); transition:all 0.25s ease;
    }
    .feedback-modal.open { opacity:1; pointer-events:auto; transform:translateY(0) }
    .feedback-modal .qr-code { width:100%; max-width:200px; height:auto; margin:0 auto 14px; display:block; background:#fff; border-radius:10px; padding:6px; cursor:pointer; }
    .feedback-modal .hint { font-size:0.78rem; color:#888; text-align:center; line-height:1.7; }
    .feedback-modal .hint .warm { color:var(--neon-cyan); }
    .feedback-modal .social-row { display:flex; gap:10px; justify-content:center; margin-top:12px; font-size:0.7rem; color:#555; }
    .feedback-overlay { position:fixed; top:0; left:0; width:100%; height:100%; z-index:55; pointer-events:none; }
    .feedback-overlay.active { pointer-events:auto; }

    /* ===== 图片灯箱 ===== */
    .img-lightbox {
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.92); backdrop-filter:blur(8px); z-index:300;
      display:flex; align-items:center; justify-content:center;
      opacity:0; pointer-events:none; transition:opacity 0.25s;
    }
    .img-lightbox.open { opacity:1; pointer-events:auto }
    .img-lightbox img { max-width:85%; max-height:80%; border-radius:12px; box-shadow:0 0 40px rgba(0,0,0,0.8); background:#fff; padding:8px; }

    /* ===== 添加到主屏幕提示 ===== */
    .home-tip {
      position:fixed; bottom:0; left:0; width:100%; z-index:90;
      background:rgba(8,8,20,0.97); backdrop-filter:blur(20px);
      padding:16px 20px calc(16px + env(safe-area-inset-bottom));
      display:flex; align-items:center; gap:12px;
      border-top:1px solid rgba(0,240,255,0.2);
      transition:transform 0.3s; transform:translateY(100%);
    }
    .home-tip.show { transform:translateY(0); }
    .home-tip-icon { font-size:1.6rem; flex-shrink:0; }
    .home-tip-text { flex:1; font-size:0.82rem; color:#999; line-height:1.5; }
    .home-tip-text b { color:var(--neon-cyan); }
    .home-tip-close {
      flex-shrink:0; background:none; border:none; color:#555;
      font-size:1.2rem; cursor:pointer; padding:4px;
    }
    .home-btn {
      position:fixed; z-index:80;
      width:40px; height:40px; border-radius:50%;
      background:rgba(8,8,20,0.85); backdrop-filter:blur(10px);
      border:1px solid rgba(0,240,255,0.2);
      display:flex; align-items:center; justify-content:center;
      font-size:1.1rem; cursor:pointer; transition:all 0.3s;
      bottom: calc(20px + env(safe-area-inset-bottom));
      right: calc(16px + env(safe-area-inset-right));
    }
    .home-btn:active { transform:scale(0.9); border-color:var(--neon-cyan); }

    /* ===== 引导页 ===== */
    .landing-page {
      position:fixed; top:0; left:0; width:100%; height:100%;
      z-index:500; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:24px;
      background: #050510;
      padding: 20px;

  <div class="toast" id="toast"></div>

  <script>
    (function() {
      // ========== 3D星空穿越Canvas ==========
      const sfCanvas = document.getElementById('starfieldCanvas');
      const sfCtx = sfCanvas.getContext('2d');
      const NUM_STARS = 250;
      let sfStars = [];
      let sfSpeed = 0.5;

      function resizeStarfield() {
        sfCanvas.width = window.innerWidth;
        sfCanvas.height = window.innerHeight;
      }
      resizeStarfield();

      function initStarfieldStars() {
        sfStars = [];
        for (let i = 0; i < NUM_STARS; i++) {
          sfStars.push({
            x: (Math.random() - 0.5) * sfCanvas.width * 2,
            y: (Math.random() - 0.5) * sfCanvas.height * 2,
            z: Math.random() * 1000,
            pz: 0
          });
        }
      }
      initStarfieldStars();

      function drawStarfield() {
        sfCtx.fillStyle = 'rgba(5, 5, 16, 0.15)';
        sfCtx.fillRect(0, 0, sfCanvas.width, sfCanvas.height);
        const cx = sfCanvas.width / 2;
        const cy = sfCanvas.height / 2;
        for (let i = 0; i < sfStars.length; i++) {
          const s = sfStars[i];
          s.pz = s.z;
          s.z -= sfSpeed;
          if (s.z <= 0) {
            s.x = (Math.random() - 0.5) * sfCanvas.width * 2;
            s.y = (Math.random() - 0.5) * sfCanvas.height * 2;
            s.z = 1000;
            s.pz = 1000;
          }
          const sx = (s.x / s.z) * 400 + cx;
          const sy = (s.y / s.z) * 400 + cy;
          const px = (s.x / s.pz) * 400 + cx;
          const py = (s.y / s.pz) * 400 + cy;
          const size = Math.max(0.3, (1 - s.z / 1000) * 2.5);
          const alpha = Math.min(1, (1 - s.z / 1000) * 1.5);
          // 近处偏青，远处偏紫
          const hue = 180 + (s.z / 1000) * 100;
          sfCtx.beginPath();
          sfCtx.strokeStyle = `hsla(${hue}, 80%, 70%, ${alpha})`;
          sfCtx.lineWidth = size;
          sfCtx.moveTo(px, py);
          sfCtx.lineTo(sx, sy);
          sfCtx.stroke();
          // 星点发光
          if (size > 1.2) {
            sfCtx.beginPath();
            sfCtx.fillStyle = `hsla(${hue}, 90%, 80%, ${alpha * 0.5})`;
            sfCtx.arc(sx, sy, size * 1.5, 0, Math.PI * 2);
            sfCtx.fill();
          }
        }
        requestAnimationFrame(drawStarfield);
      }
      drawStarfield();
      window.addEventListener('resize', () => {
        resizeStarfield();
        resizeGridCanvas();
        resizeFireworkCanvas();
      });

      // ========== 赛博朋克网格地面 ==========
      const gridCanvas = document.getElementById('gridCanvas');
      const gridCtx = gridCanvas.getContext('2d');
      let gridOffset = 0;

      function resizeGridCanvas() {
        gridCanvas.width = window.innerWidth;
        gridCanvas.height = window.innerHeight;
      }
      resizeGridCanvas();

      function drawGrid() {
        gridCtx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);
        const w = gridCanvas.width;
        const h = gridCanvas.height;
        const horizon = h * 0.65;
        const gridH = h - horizon;
        const numLines = 20;
        gridOffset = (gridOffset + 0.3) % (gridH / numLines);

        // 竖线（透视收敛）
        for (let i = -15; i <= 15; i++) {
          const baseX = w / 2 + i * 60;
          const topX = w / 2 + i * 5;
          const alpha = Math.max(0.02, 0.12 - Math.abs(i) * 0.008);
          gridCtx.beginPath();
          gridCtx.strokeStyle = `rgba(0, 240, 255, ${alpha})`;
          gridCtx.lineWidth = 0.8;
          gridCtx.moveTo(topX, horizon);
          gridCtx.lineTo(baseX, h);
          gridCtx.stroke();
        }

        // 横线（近大远小间距）
        for (let i = 0; i < numLines; i++) {
          const t = (i * (gridH / numLines) + gridOffset) / gridH;
          const y = horizon + t * t * gridH;
          if (y > h) continue;
          const alpha = Math.max(0.02, t * 0.15);
          gridCtx.beginPath();
          gridCtx.strokeStyle = `rgba(0, 240, 255, ${alpha})`;
          gridCtx.lineWidth = 0.6;
          gridCtx.moveTo(0, y);
          gridCtx.lineTo(w, y);
          gridCtx.stroke();
        }

        // 地平线发光
        const glowGrad = gridCtx.createLinearGradient(0, horizon - 20, 0, horizon + 20);
        glowGrad.addColorStop(0, 'rgba(0, 240, 255, 0)');
        glowGrad.addColorStop(0.5, 'rgba(0, 240, 255, 0.06)');
        glowGrad.addColorStop(1, 'rgba(0, 240, 255, 0)');
        gridCtx.fillStyle = glowGrad;
        gridCtx.fillRect(0, horizon - 20, w, 40);

        requestAnimationFrame(drawGrid);
      }
      drawGrid();

      // ========== URL参数检测 & 路由 ==========
      const urlParams = new URLSearchParams(window.location.search);
      const sessionId = urlParams.get('s');
      const landingPage = document.getElementById('landingPage');
      const mainApp = document.getElementById('mainApp');
      const topRightArea = document.getElementById('topRightArea');
      const soundToggleEl = document.getElementById('soundToggle');
      const clearBtnEl = document.getElementById('clearBtn');
      const fireworkCanvasEl = document.getElementById('fireworkCanvas');
      const feedbackTriggerEl = document.getElementById('feedbackTrigger');

      function isStandalone() {
        return window.matchMedia('(display-mode: standalone)').matches
          || window.navigator.standalone === true;
      }

      // ========== 灯箱（全局可用） ==========
      const lightbox = document.getElementById('imgLightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      lightbox.addEventListener('click', () => { lightbox.classList.remove('open'); });
      window.openLightbox = function(src) {
        lightboxImg.src = src; lightbox.classList.add('open');
      };

      if (!sessionId) {
        landingPage.style.display = 'flex';
        initLandingPreview();
        return;
      }

      // 有?s= → 功能页
      landingPage.classList.add('hidden');
      setTimeout(() => { landingPage.style.display = 'none'; }, 500);
      mainApp.style.display = 'flex';
      topRightArea.style.display = 'flex';
      soundToggleEl.style.display = 'flex';
      clearBtnEl.style.display = 'inline-block';
      fireworkCanvasEl.style.display = 'block';
      feedbackTriggerEl.style.display = 'flex';

      // ========== 添加到主屏幕提示 ==========
      const homeTip = document.getElementById('homeTip');
      const homeBtn = document.getElementById('homeBtn');
      const homeTipClose = document.getElementById('homeTipClose');
      const TIP_SHOWN_KEY = 'pengpeng_hometip_' + sessionId;

      if (!isStandalone()) {
        if (!localStorage.getItem(TIP_SHOWN_KEY)) {
          setTimeout(() => homeTip.classList.add('show'), 1500);
        } else {
          homeBtn.style.display = 'flex';
        }
      }
      homeTipClose.addEventListener('click', () => {
        homeTip.classList.remove('show');
        localStorage.setItem(TIP_SHOWN_KEY, '1');
        homeBtn.style.display = 'flex';
      });
      homeBtn.addEventListener('click', () => { homeTip.classList.add('show'); });

      // ========== 数据存储 ==========
      let stars = [];
      let bgStarsData = [];
      let currentViewingIndex = -1;
      const STORAGE_KEY = 'pengpeng_stars_' + sessionId;
      const BG_STARS_KEY = 'pengpeng_bg_stars_' + sessionId;

      // ========== 旧数据迁移 ==========
      const MIGRATE_KEY = 'pengpeng_migrated_' + sessionId;
      if (!localStorage.getItem(MIGRATE_KEY)) {
        try {
          const oldStars = localStorage.getItem('pengpeng_stars');
          const oldBg = localStorage.getItem('pengpeng_bg_stars');
          if (oldStars && !localStorage.getItem(STORAGE_KEY)) localStorage.setItem(STORAGE_KEY, oldStars);
          if (oldBg && !localStorage.getItem(BG_STARS_KEY)) localStorage.setItem(BG_STARS_KEY, oldBg);
          localStorage.setItem(MIGRATE_KEY, '1');
        } catch(e) {}
      }

      function loadStars() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) { const parsed = JSON.parse(stored); stars = Array.isArray(parsed) ? parsed : []; }
        } catch(e) { stars = []; }
      }
      function saveStars() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stars)); }
        catch(e) {
          for (let i = 0; i < stars.length; i++) {
            stars.shift();
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stars)); showToast('存储空间已满，最旧的星星已消散'); return; }
            catch(e2) { continue; }
          }
        }
      }
      function addStar(starData) {
        if (!Array.isArray(stars)) stars = [];
        stars.push(starData);
        saveStars(); updateStarCounter();
      }
      function updateStarCounter() { document.getElementById('starCount').textContent = stars.length; }

      function loadBgStars() {
        try {
          const stored = localStorage.getItem(BG_STARS_KEY);
          if (stored) { const parsed = JSON.parse(stored); bgStarsData = Array.isArray(parsed) ? parsed : []; }
        } catch(e) { bgStarsData = []; }
      }
      function saveBgStars() {
        try { localStorage.setItem(BG_STARS_KEY, JSON.stringify(bgStarsData)); } catch(e) {}
      }

      // ========== 生成独特星星SVG ==========
      function generateUniqueStarSVG(text, timestamp) {
        let hash = 0;
        for (let i = 0; i < text.length; i++) { hash = ((hash << 5) - hash) + text.charCodeAt(i); hash |= 0; }
        hash = Math.abs(hash);
        const hue = (hash % 360 + (timestamp % 60) * 6) % 360;
        const saturation = 65 + (hash % 25);
        const lightness = 55 + (hash % 20);
        const color = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
        const glowColor = `hsl(${hue}, ${saturation}%, ${lightness + 15}%)`;
        const shapeIndex = hash % 5;
        const rotation = (hash % 30) - 15;
        let svgContent = '';
        if (shapeIndex === 0) svgContent = `<polygon points="24,2 29,20 48,24 29,28 24,46 19,28 0,24 19,20" fill="${color}" stroke="${glowColor}" stroke-width="0.8" transform="rotate(${rotation} 24 24)"/>`;
        else if (shapeIndex === 1) {
          const outerR=22, innerR=9; let pts=[];
          for(let i=0;i<5;i++){const aOut=(i*72-90)*Math.PI/180;const aIn=((i*72)+36-90)*Math.PI/180;pts.push(`${24+outerR*Math.cos(aOut)},${24+outerR*Math.sin(aOut)}`);pts.push(`${24+innerR*Math.cos(aIn)},${24+innerR*Math.sin(aIn)}`);}
          svgContent = `<polygon points="${pts.join(' ')}" fill="${color}" stroke="${glowColor}" stroke-width="0.8" transform="rotate(${rotation} 24 24)"/>`;
        }
        else if (shapeIndex === 2) svgContent = `<polygon points="24,2 29,14 42,14 31,22 36,36 24,28 12,36 17,22 6,14 19,14" fill="${color}" stroke="${glowColor}" stroke-width="0.8" transform="rotate(${rotation} 24 24)"/>`;
        else if (shapeIndex === 3) svgContent = `<path d="M24,40 C12,28 2,20 2,14 C2,7 8,2 14,2 C18,2 21,5 24,9 C27,5 30,2 34,2 C40,2 46,7 46,14 C46,20 36,28 24,40Z" fill="${color}" stroke="${glowColor}" stroke-width="0.8" transform="rotate(${rotation} 24 24) scale(0.9) translate(3,3)"/>`;
        else {
          let petals='';
          for(let i=0;i<6;i++){const angle=(i*60)*Math.PI/180;const cx=24+10*Math.cos(angle);const cy=24+10*Math.sin(angle);petals+=`<circle cx="${cx}" cy="${cy}" r="8" fill="${color}" stroke="${glowColor}" stroke-width="0.5"/>`;}
          svgContent = `<circle cx="24" cy="24" r="5" fill="${glowColor}"/>${petals}`;
        }
        return `<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><defs><filter id="glow_${timestamp}"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>${svgContent}</svg>`;
      }

      function getScatterStarSVG(hue, shapeIndex) {
        const color=`hsl(${hue},85%,72%)`,glow=`hsl(${hue},95%,82%)`;
        let shape='';
        if(shapeIndex===0)shape=`<polygon points="8,0 9.5,6.5 16,8 9.5,9.5 8,16 6.5,9.5 0,8 6.5,6.5" fill="${color}" stroke="${glow}" stroke-width="0.3"/>`;
        else if(shapeIndex===1){const or=7,ir=3;let pts='';for(let i=0;i<5;i++){const ao=(i*72-90)*Math.PI/180;const ai=((i*72)+36-90)*Math.PI/180;pts+=`${8+or*Math.cos(ao)},${8+or*Math.sin(ao)} ${8+ir*Math.cos(ai)},${8+ir*Math.sin(ai)} `;}shape=`<polygon points="${pts}" fill="${color}" stroke="${glow}" stroke-width="0.3"/>`;}
        else if(shapeIndex===2)shape=`<circle cx="8" cy="8" r="6.5" fill="${color}" stroke="${glow}" stroke-width="0.3"/>`;
        else if(shapeIndex===3)shape=`<path d="M8,14 C4,10 1,7 1,5 C1,3 3,1 5,1 C6.5,1 7.5,2 8,3.5 C8.5,2 9.5,1 11,1 C13,1 15,3 15,5 C15,7 12,10 8,14Z" fill="${color}" stroke="${glow}" stroke-width="0.3" transform="scale(0.85) translate(1.2,1.2)"/>`;
        else shape=`<rect x="1.5" y="1.5" width="13" height="13" rx="2" fill="${color}" stroke="${glow}" stroke-width="0.3" transform="rotate(45 8 8)"/>`;
        return `<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">${shape}</svg>`;
      }

      // ========== 背景星创建/恢复 ==========
      function createBackgroundStar() {
        const container = document.getElementById('bgStarsContainer');
        const starDiv = document.createElement('div');
        starDiv.className = 'bg-star';
        const maxX = window.innerWidth - 40, maxY = window.innerHeight - 40;
        let posX = Math.random() * maxX, posY = Math.random() * maxY;
        if (posX > window.innerWidth - 120 && posY < 80) posY = 80 + Math.random() * (maxY - 80);
        const size = 14 + Math.random() * 22;
        const hue = Math.floor(Math.random() * 360);
        const color = `hsl(${hue}, 80%, 75%)`, glowColor = `hsl(${hue}, 90%, 85%)`;
        const center = size / 2, spikeLen = size * 0.45, innerLen = size * 0.15;
        const points = [];
        for (let i = 0; i < 4; i++) {
          const angleOut = (i * 90) * Math.PI / 180, angleIn = ((i * 90) + 45) * Math.PI / 180;
          points.push(`${center + spikeLen * Math.cos(angleOut)},${center + spikeLen * Math.sin(angleOut)}`);
          points.push(`${center + innerLen * Math.cos(angleIn)},${center + innerLen * Math.sin(angleIn)}`);
        }
        const uniqueId = 'bg' + Date.now() + Math.random();
        const svgNS = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(svgNS, "svg");
        svg.setAttribute("width", size); svg.setAttribute("height", size);
        svg.setAttribute("viewBox", `0 0 ${size} ${size}`);
        svg.innerHTML = `<defs><filter id="glow_${uniqueId}"><feGaussianBlur stdDeviation="1.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><polygon points="${points.join(' ')}" fill="${color}" stroke="${glowColor}" stroke-width="0.5" filter="url(#glow_${uniqueId})"/>`;
        starDiv.appendChild(svg);
        starDiv.style.left = posX + 'px'; starDiv.style.top = posY + 'px';
        starDiv.style.width = size + 'px'; starDiv.style.height = size + 'px';
        container.appendChild(starDiv);
        bgStarsData.push({ posX, posY, size, color, glowColor, pointsStr: points.join(' ') });
        saveBgStars();
      }
      function restoreBgStars() {
        const container = document.getElementById('bgStarsContainer');
        bgStarsData.forEach(data => {
          const starDiv = document.createElement('div');
          starDiv.className = 'bg-star';
          const uniqueId = 'bg' + Date.now() + Math.random();
          const svgNS = "http://www.w3.org/2000/svg";
          const svg = document.createElementNS(svgNS, "svg");
          svg.setAttribute("width", data.size); svg.setAttribute("height", data.size);
          svg.setAttribute("viewBox", `0 0 ${data.size} ${data.size}`);
          svg.innerHTML = `<defs><filter id="glow_${uniqueId}"><feGaussianBlur stdDeviation="1.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><polygon points="${data.pointsStr}" fill="${data.color}" stroke="${data.glowColor}" stroke-width="0.5" filter="url(#glow_${uniqueId})"/>`;
          starDiv.appendChild(svg);
          starDiv.style.left = data.posX + 'px'; starDiv.style.top = data.posY + 'px';
          starDiv.style.width = data.size + 'px'; starDiv.style.height = data.size + 'px';
          container.appendChild(starDiv);
        });
      }

      // ========== 批量删除 ==========
      let batchMode = false;
      let selectedIndices = new Set();
      const batchDeleteBtn = document.getElementById('batchDeleteBtn');
      const batchActions = document.getElementById('batchActions');
      const confirmBatchBtn = document.getElementById('confirmBatchBtn');
      const cancelBatchBtn = document.getElementById('cancelBatchBtn');
      function renderGalaxy() {
        const content = document.getElementById('galaxyContent');
        content.innerHTML = '';
        if (stars.length === 0) { content.innerHTML = '<div class="empty-hint">还没有星星<br>去丢一些烦恼吧</div>'; return; }
        stars.forEach((star, index) => {
          const div = document.createElement('div');
          div.className = 'galaxy-star';
          if (batchMode && selectedIndices.has(index)) div.classList.add('selected');
          div.innerHTML = star.svg;
          div.addEventListener('click', () => {
            if (batchMode) {
              if (selectedIndices.has(index)) { selectedIndices.delete(index); div.classList.remove('selected'); }
              else { selectedIndices.add(index); div.classList.add('selected'); }
            } else { openStarDetail(index); }
          });
          content.appendChild(div);
        });
      }
      function enterBatchMode() {
        batchMode = true; selectedIndices.clear();
        batchDeleteBtn.style.display = 'none'; batchActions.classList.add('visible'); renderGalaxy();
      }
      function exitBatchMode() {
        batchMode = false; selectedIndices.clear();
        batchDeleteBtn.style.display = 'inline-block'; batchActions.classList.remove('visible'); renderGalaxy();
      }
      batchDeleteBtn.addEventListener('click', enterBatchMode);
      cancelBatchBtn.addEventListener('click', exitBatchMode);
      confirmBatchBtn.addEventListener('click', () => {
        if (selectedIndices.size === 0) { showToast('还没有选择星星'); return; }
        const indices = Array.from(selectedIndices).sort((a,b) => b-a);
        indices.forEach(i => stars.splice(i, 1));
        saveStars(); updateStarCounter();
        showToast(`已删除 ${indices.length} 颗星星`);
        exitBatchMode(); renderGalaxy();
        if (currentViewingIndex !== -1 && indices.includes(currentViewingIndex)) closeStarDetail();
      });

      function showGalaxy() { renderGalaxy(); if (batchMode) exitBatchMode(); document.getElementById('galaxyModal').classList.add('open'); }
      function hideGalaxy() { document.getElementById('galaxyModal').classList.remove('open'); if (batchMode) exitBatchMode(); }

      function openStarDetail(index) {
        if (index < 0 || index >= stars.length) return;
        currentViewingIndex = index;
        const star = stars[index];
        document.getElementById('detailStarIcon').innerHTML = star.svg;
        const svgEl = document.getElementById('detailStarIcon').querySelector('svg');
        if (svgEl) { svgEl.setAttribute('width', '64'); svgEl.setAttribute('height', '64'); }
        document.getElementById('detailText').textContent = star.text || '(当时没有记录文字)';
        const date = new Date(star.time);
        document.getElementById('detailTime').textContent =
          `${date.getFullYear()}/${String(date.getMonth()+1).padStart(2,'0')}/${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
        document.getElementById('starDetailModal').classList.add('open');
      }
      function closeStarDetail() { document.getElementById('starDetailModal').classList.remove('open'); currentViewingIndex = -1; }
      function handleDeleteStar() {
        if (currentViewingIndex >= 0 && currentViewingIndex < stars.length) {
          stars.splice(currentViewingIndex, 1); saveStars(); updateStarCounter();
          showToast('这颗星星的记忆已消散'); closeStarDetail(); renderGalaxy();
        }
      }

      // ========== 散落特效 ==========
      function triggerScatterEffect(centerX, centerY) {
        const starCount = 28;
        const colors = [45,180,280,340,60,200,320,15,150,260,100,30,220,350,170,290,80,130,310,50];
        for (let i = 0; i < starCount; i++) {
          const star = document.createElement('div');
          star.className = 'scatter-star';
          const hue = colors[i % colors.length] + Math.floor(Math.random() * 30);
          star.innerHTML = getScatterStarSVG(hue, i % 5);
          const angle = (i / starCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.6;
          const baseDistance = 60 + Math.random() * 140;
          star.style.setProperty('--dx15', Math.cos(angle) * baseDistance * 0.4 + 'px');
          star.style.setProperty('--dy15', Math.sin(angle) * baseDistance * 0.4 - 20 + 'px');
          star.style.setProperty('--dx40', Math.cos(angle) * baseDistance * 0.75 + 'px');
          star.style.setProperty('--dy40', Math.sin(angle) * baseDistance * 0.75 - 10 + 'px');
          star.style.setProperty('--dx100', Math.cos(angle) * baseDistance + 'px');
          star.style.setProperty('--dy100', Math.sin(angle) * baseDistance + 40 + 'px');
          star.style.left = centerX + 'px'; star.style.top = centerY + 'px';
          star.style.width = '16px'; star.style.height = '16px';
          star.style.animationDelay = (Math.random() * 0.06) + 's';
          document.body.appendChild(star);
          setTimeout(() => star.remove(), 2000);
        }
        const centerBigStar = document.createElement('div');
        centerBigStar.style.cssText = `position:fixed;z-index:29;pointer-events:none;left:${centerX}px;top:${centerY}px;width:64px;height:64px;transform:translate(-50%,-50%) scale(0);transition:all 0.8s cubic-bezier(0.25,0.1,0.15,1.2);`;
        if (stars.length > 0) {
          centerBigStar.innerHTML = stars[stars.length-1].svg;
          const svgEl = centerBigStar.querySelector('svg');
          if (svgEl) { svgEl.setAttribute('width','64'); svgEl.setAttribute('height','64'); }
        }
        document.body.appendChild(centerBigStar);
        requestAnimationFrame(() => { centerBigStar.style.transform = 'translate(-50%,-50%) scale(1)'; });
        setTimeout(() => {
          const dashboard = document.getElementById('starDashboard');
          const dashRect = dashboard.getBoundingClientRect();
          centerBigStar.style.left = (dashRect.left + dashRect.width/2) + 'px';
          centerBigStar.style.top = (dashRect.top + dashRect.height/2) + 'px';
          centerBigStar.style.transform = 'translate(-50%,-50%) scale(0.5)';
          centerBigStar.style.opacity = '0.6';
        }, 500);
        setTimeout(() => centerBigStar.remove(), 1400);
      }

      function vibrate(p) { if (navigator.vibrate) navigator.vibrate(p); }
      function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }

      // ========== 声音开关 ==========
      let soundEnabled = true;
      soundToggleEl.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundToggleEl.textContent = soundEnabled ? '🔊' : '🔇';
        soundToggleEl.classList.toggle('on', soundEnabled);
      });

      // ========== 黑洞核心 ==========
      const throwBtn = document.getElementById('throwBtn');
      const textInput = document.getElementById('textInput');
      const blackHole = document.getElementById('blackHole');
      const blackHoleWrapper = document.getElementById('blackHoleWrapper');

      function triggerBlackHole() {
        const text = textInput.value.trim();
        if (!text) { showToast('写点什么再丢进去吧'); vibrate(30); return; }
        textInput.blur(); window.scrollTo(0, 0);
        throwBtn.disabled = true;
        // 黑洞加速吸引星空
        sfSpeed = 3;
        setTimeout(() => {
          vibrate([30,50,30]);
          const textRect = textInput.getBoundingClientRect();
          const holeRect = blackHoleWrapper.getBoundingClientRect();
          const centerX = holeRect.left + holeRect.width/2;
          const centerY = holeRect.top + holeRect.height/2;
          const chars = text.split('');
          chars.forEach((char, index) => {
            const span = document.createElement('span');
            span.textContent = char;
            span.style.cssText = `position:fixed;left:${textRect.left + Math.random()*textRect.width}px;top:${textRect.top + Math.random()*textRect.height}px;color:var(--neon-cyan);font-size:1.2rem;font-weight:bold;z-index:25;pointer-events:none;transition:all 0.7s cubic-bezier(0.25,0.1,0.25,1);opacity:1;text-shadow:0 0 8px rgba(0,240,255,0.6);`;
            document.body.appendChild(span);
            requestAnimationFrame(() => {
              span.style.transform = `translate(${centerX - parseFloat(span.style.left)}px, ${centerY - parseFloat(span.style.top)}px) scale(0.2) rotate(${Math.random()*720}deg)`;
              span.style.opacity = '0';
            });
            setTimeout(() => span.remove(), 700 + index*10);
          });
          textInput.value = '';
          setTimeout(() => {
            blackHole.style.transform = 'translate(-50%, -50%) scale(1.25)';
            blackHole.style.boxShadow = '0 0 80px rgba(0,240,255,0.9), 0 0 120px rgba(180,74,255,0.6), 0 0 160px rgba(0,0,0,1), inset 0 0 50px rgba(0,240,255,0.4)';
            vibrate(50);
          }, 400);
          setTimeout(() => {
            try {
              blackHole.style.transform = 'translate(-50%, -50%) scale(1)';
              blackHole.style.boxShadow = '';
              sfSpeed = 0.5; // 恢复正常速度
              const timestamp = Date.now();
              const svgString = generateUniqueStarSVG(text, timestamp);
              addStar({ svg: svgString, text: text.slice(0,200), time: timestamp });
              triggerScatterEffect(holeRect.left + holeRect.width/2, holeRect.top + holeRect.height/2);
              createBackgroundStar();
            } catch(e) {
              sfSpeed = 0.5;
              console.error('星星创建出错:', e); showToast('出错: ' + e.message);
            } finally { throwBtn.disabled = false; }
          }, 800);
        }, 300);
      }
      throwBtn.addEventListener('click', triggerBlackHole);
      textInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); triggerBlackHole(); }
      });

      document.getElementById('voiceHintBtn').addEventListener('click', () => {
        showToast('点击输入框 → 按键盘上的🎤即可语音输入');
      });

      // ========== 3D倾斜交互 ==========
      function initTilt(card) {
        card.addEventListener('touchmove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.touches[0].clientX - rect.left;
          const y = e.touches[0].clientY - rect.top;
          const rotateX = ((y - rect.height/2) / (rect.height/2)) * -6;
          const rotateY = ((x - rect.width/2) / (rect.width/2)) * 6;
          card.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });
        card.addEventListener('touchend', () => {
          card.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg)';
        });
      }
      document.querySelectorAll('.tilt-card').forEach(initTilt);

      // ========== 弹窗交互 ==========
      document.getElementById('starDashboard').addEventListener('click', showGalaxy);
      document.getElementById('closeGalaxy').addEventListener('click', hideGalaxy);
      document.getElementById('galaxyModal').addEventListener('click', (e) => { if(e.target === document.getElementById('galaxyModal')) hideGalaxy(); });
      document.getElementById('closeDetailBtn').addEventListener('click', closeStarDetail);
      document.getElementById('deleteStarBtn').addEventListener('click', handleDeleteStar);
      document.getElementById('starDetailModal').addEventListener('click', (e) => { if(e.target === document.getElementById('starDetailModal')) closeStarDetail(); });

      // ========== 反馈弹窗 ==========
      const feedbackModal = document.getElementById('feedbackModal');
      const feedbackOverlay = document.getElementById('feedbackOverlay');
      feedbackTriggerEl.addEventListener('click', () => {
        const isOpen = feedbackModal.classList.contains('open');
        if (isOpen) { feedbackModal.classList.remove('open'); feedbackOverlay.classList.remove('active'); }
        else { feedbackModal.classList.add('open'); feedbackOverlay.classList.add('active'); }
      });
      feedbackOverlay.addEventListener('click', () => {
        feedbackModal.classList.remove('open'); feedbackOverlay.classList.remove('active');
      });

      const qrImage = document.getElementById('qrImage');
      qrImage.addEventListener('click', () => { openLightbox(qrImage.src); });

      // ========== 清空星空 + 烟花 ==========
      const fCtx = fireworkCanvasEl.getContext('2d');
      let clearPending = false;
      let clearTimer = null;
      let fireworksRunning = false;

      function resizeFireworkCanvas() {
        fireworkCanvasEl.width = window.innerWidth;
        fireworkCanvasEl.height = window.innerHeight;
      }
      resizeFireworkCanvas();

      class FireworkParticle {
        constructor(x, y, color, vx, vy, size, decay, gravity) {
          this.x = x; this.y = y; this.color = color;
          this.vx = vx; this.vy = vy;
          this.size = Math.max(0.5, size);
          this.alpha = 1; this.decay = decay; this.gravity = gravity;
        }
        update() {
          this.vx *= 0.98; this.vy *= 0.98;
          this.vy += this.gravity;
          this.x += this.vx; this.y += this.vy;
          this.alpha -= this.decay;
        }
        draw(ctx) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, this.alpha);
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.arc(this.x, this.y, Math.max(0.3, this.size), 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
      class FireworkRocket {
        constructor(sx, sy, tx, ty, color) {
          this.x = sx; this.y = sy;
          this.tx = tx; this.ty = ty;
          this.color = color;
          this.speed = 4 + Math.random() * 2;
          this.angle = Math.atan2(ty - sy, tx - sx);
          this.vx = Math.cos(this.angle) * this.speed;
          this.vy = Math.sin(this.angle) * this.speed;
          this.trail = [];
          this.alive = true;
          this.distTotal = Math.sqrt((tx-sx)**2 + (ty-sy)**2);
          this.distTraveled = 0;
        }
        update() {
          this.trail.push({x: this.x, y: this.y, alpha: 0.6});
          if (this.trail.length > 8) this.trail.shift();
          this.trail.forEach(t => t.alpha -= 0.08);
          this.x += this.vx; this.y += this.vy;
          this.distTraveled += this.speed;
          if (this.distTraveled >= this.distTotal) this.alive = false;
        }
        draw(ctx) {
          this.trail.forEach(t => {
            if (t.alpha <= 0) return;
            ctx.save();
            ctx.globalAlpha = Math.max(0, t.alpha);
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(t.x, t.y, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          });
          ctx.save();
          ctx.fillStyle = '#fff';
          ctx.shadowColor = this.color;
          ctx.shadowBlur = 6;
          ctx.beginPath();
          ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      let rockets = [];
      let fParticles = [];

      function launchFireworks() {
        if (fireworksRunning) return;
        fireworksRunning = true;
        const rocketCount = 5 + Math.floor(Math.random() * 4);
        const fwColors = ['#00f0ff', '#ff2d95', '#b44aff', '#ffd966', '#00ff88', '#ff6644', '#44aaff'];
        let launched = 0;
        function launchOne() {
          if (launched >= rocketCount) return;
          rockets.push(new FireworkRocket(
            fireworkCanvasEl.width * (0.2 + Math.random() * 0.6), fireworkCanvasEl.height,
            fireworkCanvasEl.width * (0.15 + Math.random() * 0.7), fireworkCanvasEl.height * (0.1 + Math.random() * 0.35),
            fwColors[Math.floor(Math.random() * fwColors.length)]
          ));
          launched++;
          setTimeout(launchOne, 200 + Math.random() * 400);
        }
        launchOne();
        function animateFireworks() {
          fCtx.clearRect(0, 0, fireworkCanvasEl.width, fireworkCanvasEl.height);
          fCtx.globalCompositeOperation = 'lighter';
          for (let i = rockets.length - 1; i >= 0; i--) {
            rockets[i].update();
            rockets[i].draw(fCtx);
            if (!rockets[i].alive) {
              const r = rockets[i];
              const pCount = 40 + Math.floor(Math.random() * 30);
              for (let j = 0; j < pCount; j++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 4;
                fParticles.push(new FireworkParticle(r.x, r.y, r.color,
                  Math.cos(angle) * speed, Math.sin(angle) * speed,
                  1 + Math.random() * 1.5, 0.008 + Math.random() * 0.012, 0.04));
              }
              if (soundEnabled) {
                try {
                  const actx = new (window.AudioContext || window.webkitAudioContext)();
                  const osc = actx.createOscillator(); const gain = actx.createGain();
                  osc.type = 'sine'; osc.frequency.value = 60 + Math.random() * 40;
                  gain.gain.setValueAtTime(0.3, actx.currentTime);
                  gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.3);
                  osc.connect(gain); gain.connect(actx.destination);
                  osc.start(); osc.stop(actx.currentTime + 0.3);
                  const bufSize = actx.sampleRate * 0.2;
                  const buf = actx.createBuffer(1, bufSize, actx.sampleRate);
                  const data = buf.getChannelData(0);
                  for (let k = 0; k < bufSize; k++) data[k] = (Math.random() * 2 - 1) * 0.15;
                  const noise = actx.createBufferSource(); noise.buffer = buf;
                  const nGain = actx.createGain();
                  nGain.gain.setValueAtTime(0.2, actx.currentTime);
                  nGain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.2);
                  noise.connect(nGain); nGain.connect(actx.destination);
                  noise.start(); noise.stop(actx.currentTime + 0.2);
                } catch(e) {}
              }
              rockets.splice(i, 1);
            }
          }
          for (let i = fParticles.length - 1; i >= 0; i--) {
            fParticles[i].update(); fParticles[i].draw(fCtx);
            if (fParticles[i].alpha <= 0) fParticles.splice(i, 1);
          }
          fCtx.globalCompositeOperation = 'source-over';
          if (rockets.length > 0 || fParticles.length > 0) {
            requestAnimationFrame(animateFireworks);
          } else {
            fCtx.clearRect(0, 0, fireworkCanvasEl.width, fireworkCanvasEl.height);
            fireworksRunning = false;
          }
        }
        requestAnimationFrame(animateFireworks);
      }

      clearBtnEl.addEventListener('click', () => {
        if (stars.length === 0 && bgStarsData.length === 0) {
          showToast('星空已经是空的了'); return;
        }
        if (clearPending) {
          clearTimeout(clearTimer); clearPending = false;
          const container = document.getElementById('bgStarsContainer');
          const bgStarEls = container.querySelectorAll('.bg-star');
          bgStarEls.forEach((star, i) => { setTimeout(() => star.classList.add('vanishing'), i * 50); });
          setTimeout(() => {
            container.innerHTML = '';
            stars = []; bgStarsData = [];
            saveStars(); saveBgStars(); updateStarCounter();
            launchFireworks();
            showToast('星空已清空，烟花为你绽放🎆');
          }, bgStarEls.length * 50 + 600);
        } else {
          clearPending = true;
          showToast('再按一次清空星空+放烟花🎆');
          clearTimer = setTimeout(() => { clearPending = false; }, 2000);
        }
      });

      // ========== 启动 ==========
      loadStars(); loadBgStars(); updateStarCounter(); restoreBgStars();

      function initLandingPreview() {
        const preview = document.getElementById('landingStarsPreview');
        if (!preview) return;
        for (let i = 0; i < 12; i++) {
          const starDiv = document.createElement('div');
          starDiv.className = 'bg-star';
          starDiv.style.cssText = `position:absolute; left:${Math.random()*180}px; top:${Math.random()*100}px;`;
          const size = 12 + Math.random() * 16;
          const hue = Math.floor(Math.random() * 360);
          const color = `hsl(${hue}, 80%, 75%)`, glowColor = `hsl(${hue}, 90%, 85%)`;
          const center = size/2, spikeLen = size*0.4, innerLen = size*0.15;
          const points = [];
          for (let j = 0; j < 4; j++) {
            const ao = (j*90)*Math.PI/180, ai = ((j*90)+45)*Math.PI/180;
            points.push(`${center+spikeLen*Math.cos(ao)},${center+spikeLen*Math.sin(ao)}`);
            points.push(`${center+innerLen*Math.cos(ai)},${center+innerLen*Math.sin(ai)}`);
          }
          starDiv.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><polygon points="${points.join(' ')}" fill="${color}" stroke="${glowColor}" stroke-width="0.5"/></svg>`;
          starDiv.style.width = size + 'px'; starDiv.style.height = size + 'px';
          preview.appendChild(starDiv);
        }
      }
    })();
  </script>
